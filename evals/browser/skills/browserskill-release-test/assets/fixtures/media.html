<!doctype html><meta charset="utf-8"><title>Test exported recording</title><h1>Exported MP4 playback</h1>
<video id="video" src="/canvas-demo.mp4" width="640" controls preload="auto"></video><output id="media-status"></output>
<script>let v=document.querySelector('video');for(let type of ['loadedmetadata','loadeddata','playing','pause','ended','error'])v.addEventListener(type,()=>{let data={type:'media-'+type,duration:v.duration,readyState:v.readyState,width:v.videoWidth,height:v.videoHeight,error:v.error?.message};document.querySelector('output').textContent=JSON.stringify(data);fetch('/event',{method:'POST',body:JSON.stringify(data)})});</script>
