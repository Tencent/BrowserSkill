name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-protocol:
    name: Signing protocols and release manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/windows-release.test.py
      - run: python3 scripts/macos-release.test.py
      - run: node --test scripts/render-version-json.test.mjs

  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo skill package contents
        run: node scripts/check-crate-skill.mjs

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

  windows-daemon:
    name: Windows daemon, installer and cancellation regression tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Windows CLI argument error tests
        run: cargo test -p bsk --test cli_usage_errors --test cli_parse --locked

      - name: Run Windows named-pipe tests
        run: cargo test -p bsk --lib --locked daemon::ipc::windows::tests

      - name: Run Windows audit storage tests
        run: cargo test -p bsk --lib --locked daemon::audit::tests

      - name: Run Windows audit and browser interaction policy tests
        run: cargo test -p bsk --test audit_ws --test interaction_preferences --locked

      - name: Run Windows remote authorization storage tests
        run: cargo test -p bsk --lib --locked daemon::remote::authorization::tests

      - name: Run Windows remote server integration tests
        run: cargo test -p bsk --test remote_server --locked

      - name: Verify background startup refusal inside the runner Job
        run: cargo test -p bsk --test windows_daemon_start --locked restrictive_job_refuses_explicit_and_automatic_start_without_a_daemon -- --exact

      - name: Run Windows process liveness tests
        run: cargo test -p bsk --lib --locked daemon::lockfile::tests

      - name: Run Windows skill bundle installation and migration tests
        run: cargo test -p bsk --lib --test skill_install_legacy --locked skill_install

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Windows skill metadata, resources and Cargo package
        run: |
          node --test scripts/check-skill-bundles.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-skill-bundles.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-crate-skill.mjs

      - name: Run Windows update tests
        run: |
          cargo test -p bsk --lib --locked cli::update::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p bsk --test auto_update_policy --locked

      - name: Run Windows cancellation process tests
        run: cargo test -p bsk --test windows_parent_cancel --locked

      - name: Run installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/install-windows.test.ps1

      - name: Run installer tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/install-windows.test.ps1

  windows-daemon-lifecycle:
    name: Windows independent daemon and update lifecycle
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Run lifecycle regressions in a verified independent host
        shell: powershell
        run: ./scripts/test-windows-daemon.ps1

      - name: Upload lifecycle test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-daemon-lifecycle
          path: target/windows-daemon-validation/
          if-no-files-found: warn

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension types
        run: pnpm --filter @browser-skill/extension exec wxt prepare

      - name: Run lint checks
        run: pnpm lint

      - name: Build and verify the DSH npm skill package
        run: pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin build && node scripts/check-dsh-package.mjs

      - name: Compile extension TypeScript
        run: pnpm --filter @browser-skill/extension compile

      - name: Run localization tests
        run: pnpm --filter @browser-skill/i18n test

      - name: Run VOM tests
        run: pnpm --filter @browser-skill/vom test

      - name: Run extension tests
        run: pnpm ext:test

      - name: Build extension
        run: pnpm ext:build

  windows-dsh-package:
    name: Windows DSH npm package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DSH runner tests on Windows
        run: pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin exec vitest run tests/runner.test.ts

      - name: Build the DSH plugin
        run: pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin build

      - name: Verify the npm archive and runtime resource paths
        env:
          TEMP: ${{ runner.temp }}/bsk package & cache
          TMP: ${{ runner.temp }}/bsk package & cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          node scripts/check-dsh-package.mjs

  browser-download:
    name: Browser download cancellation regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare extension types
        run: pnpm --filter @browser-skill/extension exec wxt prepare
      - name: Run download cancellation browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/download-deadline.browser.test.ts

  browser-input:
    name: Browser input readiness regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension types
        run: pnpm --filter @browser-skill/extension exec wxt prepare

      - name: Run download-effect-state browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/download-effect-state.browser.test.ts

      - name: Run browser input and debugging regressions
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/*click*.browser.test.ts src/tools/__tests__/observation-layers.browser.test.ts src/debug/__tests__/*.browser.test.ts

      - name: Run element wait browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/waits.browser.test.ts

      - name: Run shared-control live text browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/cooperation/live-text.browser.test.ts

      - name: Run emulation-lifecycle browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/emulation-lifecycle.browser.test.ts

      - name: Run structured extraction browser regression
        working-directory: apps/extension
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/extract/extract.browser.test.ts

      - name: Run drag browser regression
        working-directory: apps/extension
        env:
          BSK_DRAG_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/drag.browser.test.ts

      - name: Run fill browser regression
        working-directory: apps/extension
        env:
          BSK_FILL_CHROME: google-chrome
        run: pnpm exec vitest run src/tools/__tests__/fill.browser.test.ts

  browser-video:
    name: Browser video recording regression
    # Allows Chrome for Testing's user-namespace sandbox without a custom
    # AppArmor profile for its temporary installation path.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BSK_VIDEO_ARTIFACTS: ${{ github.workspace }}/evals/browser/results/video-regression

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome for Testing
        run: |
          video_chrome_download=$(curl --fail --silent --show-error --location https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er '.channels.Stable.downloads.chrome[] | select(.platform == "linux64") | .url')
          curl --fail --silent --show-error --location --retry 3 "$video_chrome_download" --output "$RUNNER_TEMP/video-chrome.zip"
          unzip -q "$RUNNER_TEMP/video-chrome.zip" -d "$RUNNER_TEMP/video-chrome"
          echo "BSK_VIDEO_CHROME=$RUNNER_TEMP/video-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          mkdir -p "$BSK_VIDEO_ARTIFACTS"
          "$RUNNER_TEMP/video-chrome/chrome-linux64/chrome" --version | tee "$BSK_VIDEO_ARTIFACTS/chrome-version.txt"
      - name: Build CLI, extension and DSH plugin
        run: |
          cargo build -p bsk --locked
          pnpm --filter @browser-skill/extension build
          pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin build
      - name: Validate interaction capture on HTTP intranet pages
        working-directory: apps/extension
        env:
          BSK_COOP_CHROME: ${{ env.BSK_VIDEO_CHROME }}
        run: pnpm exec vitest run src/content/__tests__/cooperation-capture.browser.test.ts
      - name: Validate thumbnail cancellation, synchronization and navigating clicks
        working-directory: packages/dsh-plugin-browserskill
        env:
          BSK_COOP_CHROME: ${{ env.BSK_VIDEO_CHROME }}
          BSK_COOP_BSK: ../../target/debug/bsk
        run: pnpm exec vitest run tests/cooperation.browser.test.ts
      - name: Validate task termination on tab detachment
        working-directory: apps/extension
        env:
          BSK_TAB_DETACH_CHROME: ${{ env.BSK_VIDEO_CHROME }}
          BSK_TAB_DETACH_REPORT: ${{ env.BSK_VIDEO_ARTIFACTS }}/tab-detachment.json
        run: pnpm exec vitest run src/session-manager/__tests__/tab-detachment.browser.test.ts
      - name: Validate capture, playback, recovery and CLI/DSH export
        working-directory: apps/extension
        env:
          BSK_VIDEO_BSK: ../../target/debug/bsk
        run: pnpm exec vitest run src/video/*.browser.test.ts --reporter=default --reporter=json --outputFile.json="$BSK_VIDEO_ARTIFACTS/results.json"

      - name: Upload video regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-regression
          path: ${{ env.BSK_VIDEO_ARTIFACTS }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Build extension for the isolated native-dialog daemon
        env:
          BSK_DAEMON_WS_URL: ws://127.0.0.1:52837
        run: pnpm --filter @browser-skill/extension build

      - name: Validate native dialogs, held control, download recovery and teardown
        env:
          BSK_DIALOG_CHROME: ${{ env.BSK_VIDEO_CHROME }}
          BSK_DIALOG_TEST_TIMEOUT: "1"
          BSK_DIALOG_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: xvfb-run -a node evals/browser/cases/regression/js-dialog-control/run.mjs

      - name: Upload native-dialog regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dialog-regression
          path: evals/browser/results/js-dialog-control/
          if-no-files-found: ignore

      - name: Build extension for the isolated drag daemon
        env:
          BSK_DAEMON_WS_URL: ws://127.0.0.1:52839
        run: pnpm --filter @browser-skill/extension build

      - name: Validate drag CLI, native drops, recovery and cross-origin frame refs
        env:
          BSK_DRAG_CHROME: ${{ env.BSK_VIDEO_CHROME }}
        run: node evals/browser/cases/regression/drag-interactions/run.mjs

      - name: Upload drag regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drag-regression
          path: evals/browser/results/drag-interactions/
          if-no-files-found: ignore

  node-scripts:
    name: Node script tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate skill references and entry point budgets
        run: node scripts/check-skill-bundles.mjs

      - name: Run script tests
        run: node --test scripts/*.test.mjs
