packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  spawn-sync: true

# The published primitives entry imports packages listed only as devDependencies upstream.
packageExtensions:
  "@deepseek-ai/dsh-client-ui-primitives@0.1.5-rc.3":
    dependencies:
      "@shikijs/langs": "^4.3.1"
      "anser": "^2.3.5"
      "clsx": "^2.0.0"
      "katex": "^0.16.47"
      "mdast-util-from-markdown": "^2.0.3"
      "mdast-util-gfm": "^3.1.0"
      "mdast-util-math": "^3.0.0"
      "micromark-core-commonmark": "^2.0.3"
      "micromark-extension-gfm": "^3.0.0"
      "micromark-extension-math": "^3.1.0"
      "micromark-factory-space": "^2.0.1"
      "micromark-util-character": "^2.1.1"
      "micromark-util-classify-character": "^2.0.1"
      "micromark-util-sanitize-uri": "^2.0.1"
      "micromark-util-symbol": "^2.0.1"
      "shiki": "^4.3.1"
    peerDependencies:
      react: "^18.2.0"
      react-dom: "^18.2.0"
